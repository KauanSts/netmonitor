{% extends 'base.html' %}
{% block content %}
<h2>Cadastro de dispositivo</h2>
{% if error %}<p role="alert" class="notice">{{ error }}</p>{% endif %}
<form method="post" class="device-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="name">Nome</label>
  <input id="name" name="name" required maxlength="100" value="{{ device.name if device else '' }}">
  <label for="address">Endereço IPv4, IPv6 ou domínio</label>
  <input id="address" name="address" required maxlength="254" placeholder="127.0.0.1, ::1 ou example.com" value="{{ device.address if device else '' }}">
  <label for="device_type">Tipo</label>
  <select id="device_type" name="device_type" required>
    {% for type in types %}<option value="{{ type }}" {% if device and device.device_type == type %}selected{% endif %}>{{ type }}</option>{% endfor %}
  </select>
  <label for="description">Descrição (opcional)</label>
  <textarea id="description" name="description" maxlength="1000" rows="4">{{ device.description if device else '' }}</textarea>
  <div class="actions"><button type="submit">Salvar</button><a href="{{ url_for('index') }}">Cancelar</a></div>
</form>
{% endblock %}
